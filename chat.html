<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>asaplimo</title>
<link rel="icon" type="image/png" href="icons/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=JetBrains+Mono:wght@400;500&display=swap">
<script>try{var t=localStorage.getItem("asaplimo_theme");document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))}catch(e){}</script>
<style>
:root{--bg:#faf9f5;--panel:#fff;--side:#f3f1ea;--hover:#ebe8df;--line:#e2dfd6;--text:#1f1e1d;--dim:#66645d;--faint:#99968d;--accent:#c4623f;--userbg:#efede5;--code:#f3f1ea}
:root[data-theme="dark"]{--bg:#262624;--panel:#30302e;--side:#1f1e1d;--hover:#2c2b29;--line:#3e3d3a;--text:#f3f1ea;--dim:#b3b0a7;--faint:#7e7b73;--accent:#d9805f;--userbg:#30302e;--code:#1f1e1d}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
body{background:var(--bg);color:var(--text);font:15px/1.6 Inter,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:none;height:100dvh}
#app.on{display:flex}
#side{width:272px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;padding:14px 10px 10px}
.word{font:500 22px "Source Serif 4",Georgia,serif;padding:4px 10px 14px}
.newbtn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:10px;font-weight:500;text-align:left}
.newbtn:hover,.conv:hover,.mrow:hover,.icon:hover{background:var(--hover)}
.lbl{color:var(--faint);font-size:12.5px;padding:16px 10px 6px}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.conv{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim);font-size:14px}
.conv.on{background:var(--hover);color:var(--text)}
.me{display:flex;align-items:center;gap:10px;padding:10px 6px 4px;border-top:1px solid var(--line);margin-top:8px}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex-shrink:0}
.who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.who b{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-size:12px;color:var(--faint)}
.icon{border-radius:8px;padding:6px 9px;color:var(--dim);font-size:15px;line-height:1}
.links{display:flex;gap:14px;padding:6px 8px 2px;font-size:12.5px}
.links a,.links button{color:var(--faint);text-decoration:none}
.links a:hover,.links button:hover{color:var(--text)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{display:flex;align-items:center;gap:8px;padding:10px 14px}
#burger{display:none}
.mwrap{position:relative}
#model-btn{padding:6px 10px;border-radius:8px;color:var(--dim);font-size:14px}
#model-btn:hover{background:var(--hover);color:var(--text)}
#model-panel{position:absolute;top:100%;left:0;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:10}
.mrow{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px}
.mrow.on{font-weight:600}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column}
#hello{margin:auto;padding:24px;text-align:center}
#hello h1{font:400 38px/1.2 "Source Serif 4",Georgia,serif;letter-spacing:-.01em}
#hello p{color:var(--dim);margin-top:10px}
#thread{width:100%;max-width:740px;margin:0 auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:26px}
.m.user{align-self:flex-end;max-width:85%;background:var(--userbg);border-radius:18px;padding:10px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.assistant{overflow-wrap:anywhere}
.bub p{margin:0 0 .8em}
.bub p:last-child{margin-bottom:0}
.bub ul,.bub ol{margin:0 0 .8em 1.4em}
.bub li{margin-bottom:.25em}
.bub h4{font:500 17px "Source Serif 4",Georgia,serif;margin:1em 0 .4em}
.bub strong{font-weight:600}
.bub code{background:var(--code);border:1px solid var(--line);padding:1px 5px;border-radius:5px;font:13px "JetBrains Mono",monospace}
.code{position:relative;margin:.4em 0 .9em}
.code pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;font:13px/1.6 "JetBrains Mono",monospace}
.code pre code{background:none;border:0;padding:0}
.cp{position:absolute;top:8px;right:8px;font-size:12px;color:var(--dim);padding:3px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.th{color:var(--dim);font-size:13.5px;margin-bottom:10px}
.th summary{cursor:pointer}
.th div{white-space:pre-wrap;margin-top:6px;padding-left:12px;border-left:2px solid var(--line)}
.dots i{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--faint);animation:pulse 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,60%,100%{opacity:.3}30%{opacity:1}}
#inwrap{width:100%;max-width:760px;margin:0 auto;padding:0 16px 18px}
#form{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px 14px 10px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
#form:focus-within{border-color:var(--faint)}
#in{width:100%;resize:none;outline:0;max-height:200px;line-height:1.5;padding:2px 2px 6px}
#in::placeholder{color:var(--faint)}
.row{display:flex;justify-content:space-between;align-items:center}
#chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);padding:2px 2px 8px}
#chip button{color:var(--faint)}
#send{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-size:17px;display:grid;place-items:center}
#send:disabled{opacity:.35;cursor:default}
.note{text-align:center;color:var(--faint);font-size:12px;padding-top:8px}
#scrim{display:none}
@media(max-width:760px){
  #burger{display:block}
  #side{position:fixed;top:0;bottom:0;left:0;z-index:30;transform:translateX(-100%);transition:transform .18s}
  #side.open{transform:none}
  #scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
  #hello h1{font-size:30px}
}
@media(prefers-reduced-motion:reduce){#side{transition:none}.dots i{animation:none}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="word">asaplimo</div>
    <button class="newbtn" id="new">+ New chat</button>
    <div class="lbl">Recents</div>
    <div id="list"></div>
    <div class="me">
      <div class="av" id="av"></div>
      <div class="who"><b id="nm"></b><span id="pl"></span></div>
      <button class="icon" id="theme" title="Toggle theme" aria-label="Toggle theme">&#9680;</button>
    </div>
    <div class="links"><a id="up" href="subscription.html" hidden>Upgrade</a><a href="about.html">About</a><button id="out">Sign out</button></div>
  </aside>
  <div id="scrim"></div>
  <section id="main">
    <header>
      <button class="icon" id="burger" aria-label="Menu">&#9776;</button>
      <div class="mwrap"><button id="model-btn"><span id="mname">Model</span> &#9662;</button><div id="model-panel" hidden></div></div>
    </header>
    <div id="msgs">
      <div id="hello"><h1 id="hi">How can I help you today?</h1></div>
      <div id="thread"></div>
    </div>
    <div id="inwrap">
      <form id="form">
        <div id="chip" hidden><span id="chipn"></span><button type="button" id="chipx" aria-label="Remove image">&times;</button></div>
        <textarea id="in" rows="1" placeholder="Message asaplimo"></textarea>
        <div class="row">
          <button type="button" class="icon" id="attach" title="Attach an image" aria-label="Attach an image">+</button>
          <input type="file" id="file" accept="image/*" hidden>
          <button type="submit" id="send" disabled aria-label="Send">&#8593;</button>
        </div>
      </form>
      <div class="note">asaplimo can make mistakes. Double-check important things.</div>
    </div>
  </section>
</div>

<script>
const API="https://frosty-moon-2b57.oakambe24fi.workers.dev",TK="asaplimo_session_token",TH="asaplimo_theme";
const $=id=>document.getElementById(id);
let convId=null,convs=[],busy=false,models=[],cur="",img=null;
const tok=()=>{try{return localStorage.getItem(TK)}catch(e){return null}};

async function api(path,opt){
  const o=opt||{};
  o.headers=Object.assign({Authorization:"Bearer "+tok()},o.headers||{});
  const r=await fetch(API+path,o);
  if(r.status===401){location.href="index.html";throw new Error("auth")}
  return r;
}
const JSONH={"Content-Type":"application/json"};

function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem(TH,t)}catch(e){}}
$("theme").onclick=()=>setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inline(s){
  s=esc(s);
  const codes=[];
  s=s.replace(/`([^`\n]+)`/g,(m,c)=>{codes.push(c);return "\u0000"+(codes.length-1)+"\u0000"});
  s=s.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g,"$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>"<code>"+codes[i]+"</code>");
}
function block(t){
  const out=[];let list=null;
  const close=()=>{if(list){out.push("</"+list+">");list=null}};
  t.split("\n").forEach(l=>{
    let m;
    if(m=l.match(/^\s*[-*+]\s+(.*)/)){if(list!=="ul"){close();out.push("<ul>");list="ul"}out.push("<li>"+inline(m[1])+"</li>")}
    else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=="ol"){close();out.push("<ol>");list="ol"}out.push("<li>"+inline(m[1])+"</li>")}
    else{
      close();
      if(m=l.match(/^#{1,6}\s+(.*)/))out.push("<h4>"+inline(m[1])+"</h4>");
      else if(l.trim())out.push("<p>"+inline(l)+"</p>");
    }
  });
  close();
  return out.join("");
}
function render(t){
  const p=t.split(/```(\w*)\n?([\s\S]*?)```/g);let h="";
  for(let i=0;i<p.length;i+=3){
    h+=block(p[i]||"");
    if(p[i+2]!==undefined)h+='<div class="code"><button class="cp" type="button">Copy</button><pre><code>'+esc(p[i+2].replace(/\n$/,""))+"</code></pre></div>";
  }
  return h;
}
function add(role,text,thinking){
  $("hello").hidden=true;
  const m=document.createElement("div");
  m.className="m "+role;
  if(role==="user")m.textContent=text;
  else{
    m.innerHTML='<div class="bub">'+(thinking?'<details class="th"><summary>Thinking</summary><div></div></details>':"")+render(text)+"</div>";
    if(thinking)m.querySelector(".th div").textContent=thinking;
  }
  $("thread").appendChild(m);
  $("msgs").scrollTop=$("msgs").scrollHeight;
  return m;
}
function typing(){
  $("hello").hidden=true;
  const m=document.createElement("div");
  m.className="m assistant";
  m.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
  $("thread").appendChild(m);
  $("msgs").scrollTop=$("msgs").scrollHeight;
  return m;
}
$("thread").addEventListener("click",e=>{
  if(!e.target.classList.contains("cp"))return;
  const btn=e.target;
  navigator.clipboard.writeText(btn.nextElementSibling.textContent).then(()=>{btn.textContent="Copied";setTimeout(()=>{btn.textContent="Copy"},1500)}).catch(()=>{});
});

function reset(){convId=null;$("thread").innerHTML="";$("hello").hidden=false;renderList();$("in").focus()}
function closeSide(){$("side").classList.remove("open");$("scrim").classList.remove("on")}
$("new").onclick=()=>{reset();closeSide()};
$("burger").onclick=()=>{$("side").classList.add("open");$("scrim").classList.add("on")};
$("scrim").onclick=closeSide;
$("out").onclick=async()=>{try{await api("/api/logout",{method:"POST"})}catch(e){}try{localStorage.removeItem(TK)}catch(e){}location.href="index.html"};

async function loadConvs(){
  const r=await api("/api/conversations"),d=await r.json();
  convs=d.conversations||[];
  renderList();
}
function renderList(){
  $("list").innerHTML="";
  convs.forEach(c=>{
    const b=document.createElement("button");
    b.className="conv"+(c.id===convId?" on":"");
    b.textContent=c.title||"New chat";
    b.onclick=()=>{closeSide();openConv(c.id)};
    $("list").appendChild(b);
  });
}
async function openConv(id){
  const r=await api("/api/conversations/"+id);
  if(!r.ok)return;
  const c=await r.json();
  convId=c.id;
  $("thread").innerHTML="";
  if(c.messages&&c.messages.length)c.messages.forEach(m=>add(m.role,m.text));else $("hello").hidden=false;
  renderList();
}

async function loadModels(){
  const r=await api("/api/models"),d=await r.json();
  models=d.models||[];cur=d.current;
  const m=models.find(x=>x.id===cur);
  $("mname").textContent=m?m.label:"Model";
  $("model-panel").innerHTML="";
  models.forEach(x=>{
    const b=document.createElement("button");
    b.className="mrow"+(x.id===cur?" on":"");
    b.textContent=x.label+(x.locked?" (Premium)":"");
    b.onclick=async()=>{
      $("model-panel").hidden=true;
      if(x.locked){location.href="subscription.html";return}
      const s=await api("/api/set-model",{method:"POST",headers:JSONH,body:JSON.stringify({model:x.id})});
      if(s.ok)loadModels();
    };
    $("model-panel").appendChild(b);
  });
}
$("model-btn").onclick=()=>{$("model-panel").hidden=!$("model-panel").hidden};
document.addEventListener("click",e=>{if(!e.target.closest(".mwrap"))$("model-panel").hidden=true});

const inp=$("in");
function upd(){$("send").disabled=busy||(!inp.value.trim()&&!img)}
function grow(){inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,200)+"px"}
inp.oninput=()=>{grow();upd()};
inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};
$("form").onsubmit=e=>{e.preventDefault();send()};

$("attach").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];
  e.target.value="";
  if(!f||f.size>8e6)return;
  const rd=new FileReader();
  rd.onload=()=>{img={mimeType:f.type,data:String(rd.result).split(",")[1]};$("chipn").textContent=f.name;$("chip").hidden=false;upd()};
  rd.readAsDataURL(f);
};
function clearImg(){img=null;$("chip").hidden=true}
$("chipx").onclick=()=>{clearImg();upd()};

async function send(){
  const text=inp.value.trim();
  if((!text&&!img)||busy)return;
  busy=true;
  add("user",text||"(image)");
  const sent=img;
  inp.value="";grow();clearImg();upd();
  const t=typing();
  try{
    if(!convId){
      const r=await api("/api/conversations",{method:"POST",headers:JSONH,body:JSON.stringify({mode:"chat"})});
      convId=(await r.json()).id;
    }
    const body={message:text||"Describe this image.",conversationId:convId};
    if(sent)body.image=sent;
    const r=await api("/api/chat",{method:"POST",headers:JSONH,body:JSON.stringify(body)});
    t.remove();
    if(r.status===402){location.href="subscription.html";return}
    if(!r.ok){add("assistant","Something went wrong. Please try again.");return}
    const d=await r.json();
    add("assistant",d.reply||"No response.",d.thinking);
    loadConvs();
  }catch(e){t.remove();add("assistant","Could not reach the server.")}
  finally{busy=false;upd();inp.focus()}
}

async function init(){
  if(!tok()){location.href="index.html";return}
  try{
    const r=await api("/api/me"),d=await r.json();
    if(!d.authenticated){location.href="index.html";return}
    if(d.trialExpired&&!d.paid&&!d.networkUnlocked){location.href="subscription.html";return}
    const name=d.displayName||d.name||(d.email||"").split("@")[0]||"there";
    const first=name.split(" ")[0];
    $("nm").textContent=name;
    $("av").textContent=name.charAt(0).toUpperCase();
    const premium=d.paid||d.networkUnlocked;
    $("pl").textContent=premium?"Premium":(d.onTrial?d.daysLeft+" days left in trial":"Free");
    $("up").hidden=!!premium;
    $("hi").textContent="Hi, "+first+". How can I help?";
    $("app").classList.add("on");
    loadConvs();loadModels();
    inp.focus();
  }catch(e){if(e.message!=="auth")location.href="index.html"}
}
init();
</script>
</body>
</html>
