<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>asaplimo</title>
<link rel="icon" type="image/png" href="icons/logo.png">
<style>
:root{
  --bg:#0c0c0c;--panel:#0f150f;--panel2:#122612;--border:#1f4d1f;
  --fg:#33ff33;--dim:#1c8c1c;--faint:#134d13;
  --bubble-user:#005c4b;--bubble-assistant:#202c33;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--fg);font-family:"Courier New",monospace;height:100vh;overflow:hidden;font-size:13px;}
button,input,textarea{font-family:inherit;background:transparent;color:var(--fg);border:none;}
button{cursor:pointer;}
#app{display:none;height:100vh;}
#app.active{display:flex;}

#sidebar{width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.bar{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);}
.dot{width:10px;height:10px;border-radius:50%;}
.dot.r{background:#ff5f56;}.dot.y{background:#ffbd2e;}.dot.g{background:#27c93f;}
.side-pad{padding:10px;}
.btn{width:100%;text-align:left;border:1px solid var(--border);padding:8px 10px;margin-bottom:8px;}
.btn:hover{background:var(--panel2);}
.label{color:var(--faint);font-size:11px;margin:8px 0 4px;text-transform:lowercase;}
#recents{flex:1;overflow-y:auto;padding:0 10px;}
.recent{display:block;width:100%;text-align:left;padding:6px 8px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent:hover{background:var(--panel2);color:var(--fg);}
.recent.active{background:var(--panel2);color:var(--fg);}
#plan-pill{margin:0 10px 8px;border:1px solid var(--border);padding:8px;font-size:11px;color:var(--dim);}
#plan-pill button{border:1px solid var(--border);padding:4px 8px;margin-top:6px;color:var(--fg);}
#sidebar-footer{border-top:1px solid var(--border);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;}
#user-line{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

#main{flex:1;display:flex;flex-direction:column;min-width:0;}
#header{height:40px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border);}
#chat-title{color:var(--dim);}
#model-btn{margin-left:auto;border:1px solid var(--border);padding:4px 10px;}
#model-panel{position:absolute;top:44px;right:14px;background:var(--panel);border:1px solid var(--border);padding:6px;display:none;min-width:160px;z-index:20;}
#model-panel.active{display:block;}
.model-row{display:block;width:100%;text-align:left;padding:6px 8px;color:var(--dim);}
.model-row:hover{background:var(--panel2);color:var(--fg);}
.model-row.active{color:var(--fg);background:var(--panel2);}

#messages{flex:1;overflow-y:auto;padding:16px;}
#empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);text-align:center;}
#empty .prompt::before{content:"$ ";}
#list{max-width:720px;margin:0 auto;display:none;flex-direction:column;gap:10px;}
.row{display:flex;}
.row.user{justify-content:flex-end;}
.row.assistant{justify-content:flex-start;}
.bubble{max-width:80%;padding:8px 12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;font-size:13px;}
.bubble.user{background:var(--bubble-user);color:#e9fff7;border-radius:8px 8px 0 8px;}
.bubble.assistant{background:var(--bubble-assistant);color:#e6f7e6;border-radius:8px 8px 8px 0;}
.bubble code{background:rgba(0,0,0,.35);padding:1px 5px;border-radius:4px;}
.bubble pre{background:#000;border:1px solid var(--border);padding:8px;overflow-x:auto;margin-top:6px;border-radius:6px;}
.meta{font-size:10px;color:var(--faint);margin-top:2px;}
.row.user .meta{text-align:right;margin-right:2px;}
.row.assistant .meta{margin-left:2px;}
.typing{display:flex;gap:4px;padding:2px 0;}
.typing span{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes blink{0%,60%,100%{opacity:.3;}30%{opacity:1;}}

#input-area{padding:10px 16px 14px;}
#file-preview{max-width:720px;margin:0 auto 6px;display:none;flex-wrap:wrap;gap:6px;}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);padding:4px 8px;font-size:11px;color:var(--dim);}
.chip button{color:var(--fg);}
#input-form{max-width:720px;margin:0 auto;display:flex;gap:6px;border:1px solid var(--border);padding:6px;background:var(--panel);}
#chat-input{flex:1;resize:none;outline:none;max-height:140px;padding:6px;font-size:13px;}
#chat-input::placeholder{color:var(--faint);}
.icon-btn{border:1px solid var(--border);padding:6px 10px;}
.icon-btn.rec{color:#ff5f56;}
#send-btn{border:1px solid var(--dim);padding:6px 12px;}
#send-btn:disabled{opacity:.4;}
.footnote{text-align:center;color:var(--faint);font-size:10px;margin-top:8px;}
#about-link{cursor:pointer;text-decoration:underline;}
#about-link:hover{color:#fff;}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
.overlay.active{display:flex;}
.modal{width:100%;max-width:400px;border:1px solid var(--border);background:var(--panel);padding:18px;max-height:80vh;overflow-y:auto;}
.modal h3{margin-bottom:10px;}
.modal p{color:var(--dim);font-size:12px;margin-bottom:8px;line-height:1.5;}
.modal input{width:100%;border:1px solid var(--border);padding:8px;margin-bottom:8px;}
.close-x{float:right;color:var(--dim);}
#search-results .recent{border-bottom:1px solid var(--border);}

@media (max-width:720px){
  #sidebar{position:fixed;top:0;left:0;height:100vh;z-index:45;transform:translateX(-100%);transition:transform .2s;}
  #sidebar.open{transform:translateX(0);}
  #hamburger{display:inline-flex !important;}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:40;}
  .backdrop.active{display:block;}
}
#hamburger{display:none;}
</style>
</head>
<body>

<div class="backdrop" id="backdrop"></div>

<div id="app">
  <aside id="sidebar">
    <div class="bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
    <div class="side-pad">
      <button class="btn" id="new-chat-btn">./new-chat</button>
      <button class="btn" id="search-btn">grep --chats</button>
      <div class="label">recents</div>
    </div>
    <div id="recents"></div>
    <div id="plan-pill"></div>
    <div id="sidebar-footer">
      <span id="user-line">not signed in</span>
      <button id="signout-btn" title="sign out">[x]</button>
    </div>
  </aside>

  <main id="main">
    <header id="header" style="position:relative;">
      <button class="icon-btn" id="hamburger">≡</button>
      <span id="chat-title">$ new-chat</span>
      <span id="about-link">about me</span>
      <button id="model-btn">model: <span id="model-label">default</span></button>
      <div id="model-panel"></div>
    </header>

    <div id="messages">
      <div id="empty">
        <div class="prompt">asaplimo ready.</div>
        <div>ask anything.</div>
      </div>
      <div id="list"></div>
    </div>

    <div id="input-area">
      <div id="file-preview"></div>
      <form id="input-form">
        <button type="button" class="icon-btn" id="attach-btn">+</button>
        <input type="file" id="file-input" multiple style="display:none">
        <textarea id="chat-input" rows="1" placeholder="type a message..."></textarea>
        <button type="button" class="icon-btn" id="mic-btn">mic</button>
        <button type="submit" id="send-btn" disabled>send</button>
      </form>
      <div class="footnote">asaplimo can make mistakes. made by gbubemi (aka Mitchell)</div>
    </div>
  </main>
</div>

<div class="overlay" id="search-overlay">
  <div class="modal">
    <span class="close-x" id="close-search">[x]</span>
    <h3>grep --chats</h3>
    <input id="search-input" placeholder="search...">
    <div id="search-results"></div>
  </div>
</div>

<div class="overlay" id="settings-overlay">
  <div class="modal">
    <span class="close-x" id="close-settings">[x]</span>
    <h3>settings</h3>
    <div id="settings-body"></div>
  </div>
</div>

<div class="overlay" id="paywall-overlay">
  <div class="modal">
    <h3>trial ended</h3>
    <p>subscribe to keep using asaplimo. $5/mo, cancel anytime.</p>
    <button class="btn" id="subscribe-btn">subscribe --confirm</button>
    <button class="btn" id="code-toggle-btn">have a code?</button>
    <div id="code-wrap" style="display:none;">
      <input id="code-input" placeholder="enter code" style="text-transform:uppercase;">
      <button class="btn" id="code-submit-btn">unlock</button>
      <p id="code-error" style="display:none;color:#ff5f56;">invalid code.</p>
    </div>
  </div>
</div>

<script>
const API_BASE = "https://frosty-moon-2b57.oakambe24fi.workers.dev";
const TOKEN_KEY = "asaplimo_session_token";
const MAX_ITEMS = 10;
const MAX_FILE_SIZE = 15*1024*1024;

function getToken(){ try{ return localStorage.getItem(TOKEN_KEY); }catch(e){ return null; } }
function clearToken(){ try{ localStorage.removeItem(TOKEN_KEY); }catch(e){} }
function authHeaders(extra){ const h=Object.assign({},extra||{}); const t=getToken(); if(t) h.Authorization="Bearer "+t; return h; }

let currentConversationId=null, allConversations=[], isSending=false, currentUser=null, lastUserMessage=null;

async function checkSession(){
  const token=getToken();
  if(!token){ location.href="index.html"; return; }
  try{
    const res=await fetch(API_BASE+"/api/me",{headers:authHeaders()});
    const data=await res.json();
    if(data.authenticated) showApp(data); else { clearToken(); location.href="index.html"; }
  }catch(e){ location.href="index.html"; }
}

function showApp(user){
  currentUser=user;
  document.getElementById("app").classList.add("active");
  document.getElementById("user-line").textContent = user.email || "signed in";
  renderPlanPill(user);
  loadModels();
  loadConversations();
}

function renderPlanPill(user){
  const wrap=document.getElementById("plan-pill");
  if(user.paid||user.networkUnlocked){ wrap.innerHTML="premium plan active"; return; }
  if(user.onTrial){ wrap.innerHTML = (user.daysLeft||0)+" day(s) left in trial<br><button id='upgrade-btn'>upgrade --now</button>"; document.getElementById("upgrade-btn").addEventListener("click",startCheckout); return; }
  if(user.trialExpired){ wrap.innerHTML=""; document.getElementById("paywall-overlay").classList.add("active"); return; }
  wrap.innerHTML="";
}

async function startCheckout(){
  try{ const res=await fetch(API_BASE+"/api/checkout",{method:"POST",headers:authHeaders()}); const data=await res.json(); if(data.url) location.href=data.url; }catch(e){}
}
document.getElementById("subscribe-btn").addEventListener("click",startCheckout);
document.getElementById("code-toggle-btn").addEventListener("click",()=>{ const w=document.getElementById("code-wrap"); w.style.display=w.style.display==="none"?"block":"none"; });
document.getElementById("code-submit-btn").addEventListener("click",async()=>{
  const code=document.getElementById("code-input").value.trim();
  const err=document.getElementById("code-error");
  if(!code) return;
  try{
    const res=await fetch(API_BASE+"/api/network-unlock",{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({code})});
    if(res.ok){ err.style.display="none"; document.getElementById("paywall-overlay").classList.remove("active"); if(currentUser) currentUser.networkUnlocked=true; renderPlanPill(currentUser); }
    else err.style.display="block";
  }catch(e){ err.style.display="block"; }
});

document.getElementById("signout-btn").addEventListener("click",async()=>{
  try{ await fetch(API_BASE+"/api/logout",{method:"POST",headers:authHeaders()}); }catch(e){}
  clearToken(); location.href="index.html";
});

async function loadModels(){
  try{
    const res=await fetch(API_BASE+"/api/models",{headers:authHeaders()});
    const data=await res.json();
    if(data.models) renderModels(data.models,data.current);
  }catch(e){}
}
function renderModels(models,current){
  const panel=document.getElementById("model-panel");
  panel.innerHTML="";
  models.forEach(m=>{
    const row=document.createElement("button");
    row.className="model-row"+(m.id===current?" active":"");
    row.textContent=m.label+(m.locked?" (paid)":"");
    row.addEventListener("click",()=>selectModel(m));
    panel.appendChild(row);
  });
  const cur=models.find(m=>m.id===current);
  if(cur) document.getElementById("model-label").textContent=cur.label;
}
async function selectModel(m){
  if(m.locked){ document.getElementById("model-panel").classList.remove("active"); document.getElementById("paywall-overlay").classList.add("active"); return; }
  try{
    const res=await fetch(API_BASE+"/api/set-model",{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({model:m.id})});
    if(res.ok){ document.getElementById("model-label").textContent=m.label; document.getElementById("model-panel").classList.remove("active"); loadModels(); }
  }catch(e){}
}
document.getElementById("model-btn").addEventListener("click",()=>document.getElementById("model-panel").classList.toggle("active"));

async function loadConversations(){
  try{
    const res=await fetch(API_BASE+"/api/conversations",{headers:authHeaders()});
    const data=await res.json();
    allConversations=data.conversations||[];
    renderRecents();
  }catch(e){}
}
function renderRecents(){
  const list=document.getElementById("recents");
  list.innerHTML="";
  allConversations.forEach(c=>{
    const btn=document.createElement("button");
    btn.className="recent"+(c.id===currentConversationId?" active":"");
    btn.textContent=c.title;
    btn.addEventListener("click",()=>{ closeSidebar(); openConversation(c.id); });
    list.appendChild(btn);
  });
}
async function openConversation(id){
  try{
    const res=await fetch(API_BASE+"/api/conversations/"+id,{headers:authHeaders()});
    if(!res.ok) return;
    const conv=await res.json();
    currentConversationId=conv.id;
    document.getElementById("list").innerHTML="";
    if(!conv.messages||conv.messages.length===0){
      document.getElementById("empty").style.display="flex";
      document.getElementById("list").style.display="none";
    }else{
      document.getElementById("empty").style.display="none";
      document.getElementById("list").style.display="flex";
      conv.messages.forEach(m=>addBubble(m.role,m.text));
    }
    document.getElementById("chat-title").textContent="$ "+conv.title;
    renderRecents();
  }catch(e){}
}
async function ensureConversation(){
  if(currentConversationId) return currentConversationId;
  try{
    const res=await fetch(API_BASE+"/api/conversations",{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({mode:"chat"})});
    const data=await res.json();
    currentConversationId=data.id;
    await loadConversations();
  }catch(e){}
  return currentConversationId;
}
document.getElementById("new-chat-btn").addEventListener("click",()=>{
  currentConversationId=null;
  document.getElementById("list").innerHTML="";
  document.getElementById("list").style.display="none";
  document.getElementById("empty").style.display="flex";
  document.getElementById("chat-title").textContent="$ new-chat";
  closeSidebar();
});

function closeSidebar(){ document.getElementById("sidebar").classList.remove("open"); document.getElementById("backdrop").classList.remove("active"); }
document.getElementById("hamburger").addEventListener("click",()=>{ document.getElementById("sidebar").classList.toggle("open"); document.getElementById("backdrop").classList.toggle("active"); });
document.getElementById("backdrop").addEventListener("click",closeSidebar);

document.getElementById("search-btn").addEventListener("click",()=>{
  document.getElementById("search-overlay").classList.add("active");
  document.getElementById("search-input").value="";
  renderSearch(allConversations);
  document.getElementById("search-input").focus();
});
document.getElementById("close-search").addEventListener("click",()=>document.getElementById("search-overlay").classList.remove("active"));
document.getElementById("search-input").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase();
  renderSearch(q?allConversations.filter(c=>c.title.toLowerCase().includes(q)):allConversations);
});
function renderSearch(list){
  const wrap=document.getElementById("search-results");
  wrap.innerHTML="";
  if(list.length===0){ wrap.innerHTML="<p>no matches.</p>"; return; }
  list.forEach(c=>{
    const btn=document.createElement("button");
    btn.className="recent";
    btn.textContent=c.title;
    btn.addEventListener("click",()=>{ document.getElementById("search-overlay").classList.remove("active"); openConversation(c.id); });
    wrap.appendChild(btn);
  });
}

document.querySelector("#about-link").addEventListener("click",()=>{ window.open("about.html","_blank"); });

document.getElementById("close-settings").addEventListener("click",()=>document.getElementById("settings-overlay").classList.remove("active"));

const chatInput=document.getElementById("chat-input");
const sendBtn=document.getElementById("send-btn");
let pendingFiles=[];

function autoGrow(el){ el.style.height="auto"; el.style.height=el.scrollHeight+"px"; }
function updateSendState(){ sendBtn.disabled = isSending || (chatInput.value.trim().length===0 && pendingFiles.length===0); }
chatInput.addEventListener("input",()=>{ autoGrow(chatInput); updateSendState(); });
chatInput.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendMessage(); } });

document.getElementById("attach-btn").addEventListener("click",()=>document.getElementById("file-input").click());
document.getElementById("file-input").addEventListener("change",e=>{ if(e.target.files.length) handleFiles(e.target.files); });

function handleFiles(fileList){
  const files=Array.from(fileList);
  const room=MAX_ITEMS-pendingFiles.length;
  files.slice(0,room).forEach(file=>{
    if(file.size>MAX_FILE_SIZE){ alert(file.name+" too large."); return; }
    const isImage=file.type.startsWith("image/");
    const reader=new FileReader();
    reader.onload=()=>{
      pendingFiles.push({name:file.name,mimeType:file.type||"application/octet-stream",base64:reader.result.split(",")[1],isImage});
      renderChips(); updateSendState();
    };
    reader.readAsDataURL(file);
  });
}
function renderChips(){
  const wrap=document.getElementById("file-preview");
  wrap.innerHTML="";
  if(pendingFiles.length===0){ wrap.style.display="none"; return; }
  wrap.style.display="flex";
  pendingFiles.forEach((f,i)=>{
    const chip=document.createElement("div");
    chip.className="chip";
    chip.innerHTML="<span>"+f.name+"</span>";
    const rm=document.createElement("button");
    rm.textContent="x";
    rm.addEventListener("click",()=>{ pendingFiles.splice(i,1); renderChips(); updateSendState(); });
    chip.appendChild(rm);
    wrap.appendChild(chip);
  });
}

const micBtn=document.getElementById("mic-btn");
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognizer=null,isRecording=false;
if(SR){
  recognizer=new SR();
  recognizer.continuous=false; recognizer.interimResults=false; recognizer.lang="en-US";
  recognizer.addEventListener("result",e=>{
    let t=""; for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript;
    chatInput.value=(chatInput.value.trim()+" "+t).trim(); autoGrow(chatInput); updateSendState();
  });
  recognizer.addEventListener("end",()=>{ isRecording=false; micBtn.classList.remove("rec"); });
}
micBtn.addEventListener("click",()=>{
  if(!recognizer){ alert("voice input not supported."); return; }
  if(isRecording){ recognizer.stop(); return; }
  try{ recognizer.start(); isRecording=true; micBtn.classList.add("rec"); }catch(e){}
});

function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderContent(text){
  const parts=text.split(/```(\w*)\n?([\s\S]*?)```/g);
  let html="";
  for(let i=0;i<parts.length;i+=3){
    const prose=parts[i]||"";
    html+=escapeHtml(prose).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>");
    if(parts[i+2]!==undefined){
      html+="<pre>"+escapeHtml(parts[i+2].replace(/\n$/,""))+"</pre>";
    }
  }
  return html;
}
function formatTime(){ return new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}); }

function addBubble(role,text,attachments){
  const list=document.getElementById("list");
  const row=document.createElement("div");
  row.className="row "+role;
  const wrap=document.createElement("div");
  const bubble=document.createElement("div");
  bubble.className="bubble "+role;
  bubble.innerHTML=renderContent(text||"");
  wrap.appendChild(bubble);
  const meta=document.createElement("div");
  meta.className="meta";
  meta.textContent=formatTime();
  wrap.appendChild(meta);
  row.appendChild(wrap);
  list.appendChild(row);
  document.getElementById("messages").scrollTop=document.getElementById("messages").scrollHeight;
}

function showTyping(){
  const list=document.getElementById("list");
  const row=document.createElement("div");
  row.className="row assistant";
  row.id="typing-row";
  row.innerHTML='<div class="bubble assistant"><div class="typing"><span></span><span></span><span></span></div></div>';
  list.appendChild(row);
  document.getElementById("messages").scrollTop=document.getElementById("messages").scrollHeight;
}
function removeTyping(){ const r=document.getElementById("typing-row"); if(r) r.remove(); }

function deriveTitle(t){ t=(t||"").replace(/\s+/g," ").trim(); return t.length>36? t.slice(0,36)+"…" : (t||"new-chat"); }
function applyTitle(title){
  if(!currentConversationId||!title) return;
  document.getElementById("chat-title").textContent="$ "+title;
  let conv=allConversations.find(c=>c.id===currentConversationId);
  if(conv) conv.title=title; else allConversations.unshift({id:currentConversationId,title});
  renderRecents();
}

function setSending(v){ isSending=v; chatInput.disabled=v; updateSendState(); if(!v) chatInput.focus(); }

async function sendMessage(){
  if(isSending) return;
  const text=chatInput.value.trim();
  if(!text && pendingFiles.length===0) return;
  document.getElementById("empty").style.display="none";
  document.getElementById("list").style.display="flex";
  const filesToSend=pendingFiles.slice();
  lastUserMessage=text;
  addBubble("user",text);
  pendingFiles=[]; renderChips(); document.getElementById("file-input").value="";
  chatInput.value=""; chatInput.style.height="auto"; updateSendState();
  setSending(true); showTyping();
  try{
    const conversationId=await ensureConversation();
    const imageFiles=filesToSend.filter(f=>f.isImage);
    const otherFiles=filesToSend.filter(f=>!f.isImage);
    const res=await fetch(API_BASE+"/api/chat",{
      method:"POST",headers:authHeaders({"Content-Type":"application/json"}),
      body:JSON.stringify({message:text,conversationId,
        images:imageFiles.map(f=>({mimeType:f.mimeType,data:f.base64,name:f.name})),
        files:otherFiles.map(f=>({name:f.name,mimeType:f.mimeType,data:f.base64}))})
    });
    removeTyping();
    if(res.status===402){ document.getElementById("paywall-overlay").classList.add("active"); return; }
    const data=await res.json();
    addBubble("assistant",data.reply||"no response.");
    if(data.title) applyTitle(data.title);
    else{
      const conv=allConversations.find(c=>c.id===conversationId);
      if(conv&&conv.title==="New chat") applyTitle(deriveTitle(text||"attachment"));
    }
  }catch(e){
    removeTyping();
    addBubble("assistant","could not reach the server.");
  }finally{ setSending(false); }
}
document.getElementById("input-form").addEventListener("submit",e=>{ e.preventDefault(); sendMessage(); });

checkSession();
</script>
</body>
</html>
