<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>asaplimo</title>
<link rel="icon" type="image/png" href="icons/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#2b2b2b;--side:#3c3f41;--bar:#3c3f41;--text:#a9b7c6;--dim:#808385;--line:#323232;--accent:#4a88c7;--sel:#0d293e;--status:#3c3f41;--code:#1e1f20;--onacc:#fff;--user:#6a8759;}
[data-ide="eclipse"]{--bg:#fff;--side:#f3f3f3;--bar:#e8e8e8;--text:#1c1c1c;--dim:#6f6f6f;--line:#d4d4d4;--accent:#2c5c9a;--sel:#cfe0f5;--status:#e8e8e8;--code:#f6f6f6;--user:#3f7f5f;}
[data-ide="vscode"]{--bg:#1e1e1e;--side:#252526;--bar:#323233;--text:#cccccc;--dim:#858585;--line:#3c3c3c;--accent:#007acc;--sel:#37373d;--status:#007acc;--code:#161616;--onacc:#fff;--user:#4ec9b0;}
[data-ide="netbeans"]{--bg:#fff;--side:#eef1f5;--bar:#dfe5ec;--text:#222;--dim:#6b7580;--line:#c9d1da;--accent:#e76f00;--sel:#fbe3c8;--status:#dfe5ec;--code:#f4f6f8;--user:#2d6ca2;}
[data-ide="pycharm"]{--bg:#1e1f22;--side:#2b2d30;--bar:#2b2d30;--text:#bcbec4;--dim:#868a91;--line:#393b40;--accent:#3574f0;--sel:#2e436e;--status:#2b2d30;--code:#17181a;--user:#6aab73;}
[data-ide="idle"]{--bg:#fff;--side:#f0f0f0;--bar:#dcdcdc;--text:#000;--dim:#666;--line:#c8c8c8;--accent:#306998;--sel:#d6e4f2;--status:#dcdcdc;--code:#f5f5f5;--user:#b22222;}
[data-ide="jupyter"]{--bg:#fff;--side:#f7f7f7;--bar:#eee;--text:#212121;--dim:#757575;--line:#e0e0e0;--accent:#f37726;--sel:#fde5d4;--status:#f37726;--code:#f5f5f5;--onacc:#fff;--user:#2e7d32;}
[data-ide="webstorm"]{--bg:#1e1f22;--side:#2b2d30;--bar:#2b2d30;--text:#bcbec4;--dim:#868a91;--line:#393b40;--accent:#21d789;--sel:#1f3d33;--status:#2b2d30;--code:#17181a;--onacc:#06231a;--user:#21d789;}
[data-ide="sublime"]{--bg:#272822;--side:#1e1f1c;--bar:#1e1f1c;--text:#f8f8f2;--dim:#8f908a;--line:#3e3d32;--accent:#f92672;--sel:#49483e;--status:#1e1f1c;--code:#1b1c18;--user:#a6e22e;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13.5px/1.55 Inter,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,select,textarea{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{display:none;height:100dvh;flex-direction:column;padding-top:env(safe-area-inset-top)}
#app.on{display:flex}
#titlebar{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
#titlebar .logo{width:18px;height:18px;border-radius:5px;background:var(--accent);color:var(--onacc);font-weight:700;font-size:11px;display:grid;place-items:center}
.pick{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:12px}
.pick select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:3px 6px;color:var(--text);font-size:12.5px}
#proj{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
#burger{display:none;padding:2px 6px;border:1px solid var(--line);border-radius:5px}
#body{flex:1;display:flex;min-height:0}
#side{width:240px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.sh{padding:7px 12px;color:var(--dim);font-size:11.5px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
#new{color:var(--accent);font-weight:600}
#files{flex:1;overflow:auto;padding:4px 0}
.file{display:flex;gap:7px;align-items:center;width:100%;text-align:left;padding:4px 12px;color:var(--text);font:12.5px "JetBrains Mono",monospace;white-space:nowrap;overflow:hidden}
.file span{overflow:hidden;text-overflow:ellipsis}
.file i{width:8px;height:8px;border-radius:2px;background:var(--accent);flex-shrink:0}
.file:hover{background:color-mix(in srgb,var(--sel) 55%,transparent)}
.file.on{background:var(--sel)}
#userline{padding:8px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;display:flex;justify-content:space-between;gap:8px}
#userline span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#out{color:var(--dim)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;background:var(--bar);border-bottom:1px solid var(--line)}
#tab{padding:6px 14px;background:var(--bg);border-top:2px solid var(--accent);font:12.5px "JetBrains Mono",monospace}
#msgs{flex:1;overflow:auto;padding:14px 16px}
#empty{color:var(--dim);font:13px "JetBrains Mono",monospace;white-space:pre-wrap}
#list{display:none;flex-direction:column;gap:14px;max-width:820px}
.m{display:flex;gap:10px}
.gut{width:22px;flex-shrink:0;text-align:right;color:var(--dim);font:12px "JetBrains Mono",monospace;padding-top:2px;user-select:none}
.txt{flex:1;min-width:0;overflow-wrap:anywhere}
.m.u .txt{color:var(--user);font-family:"JetBrains Mono",monospace;font-size:13px;white-space:pre-wrap}
.m.a .txt{line-height:1.65}
.txt code{background:var(--code);padding:1px 5px;border-radius:3px;font:12.5px "JetBrains Mono",monospace}
.txt pre{background:var(--code);border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 12px;margin:8px 0;overflow-x:auto;font:12.5px/1.55 "JetBrains Mono",monospace;white-space:pre}
#composer{border-top:1px solid var(--line);background:var(--side);padding:8px 10px;display:flex;gap:8px;align-items:flex-end}
#composer .pr{font:13px "JetBrains Mono",monospace;color:var(--accent);padding:6px 0}
#in{flex:1;resize:none;outline:0;max-height:140px;font:13.5px/1.45 "JetBrains Mono",monospace;padding:6px 0}
#in::placeholder{color:var(--dim)}
#send{background:var(--accent);color:var(--onacc);border-radius:5px;padding:6px 12px;font-weight:600;font-size:12.5px}
#send:disabled{opacity:.4}
#status{background:var(--status);color:var(--text);font-size:11.5px;padding:3px 10px;display:flex;gap:14px;border-top:1px solid var(--line);overflow:hidden;white-space:nowrap}
[data-ide="vscode"] #status,[data-ide="jupyter"] #status{color:#fff}
#status .r{margin-left:auto}
.ty{display:inline-block;color:var(--dim);font-family:"JetBrains Mono",monospace}
@media(max-width:720px){#burger{display:block}#side{position:fixed;top:0;bottom:0;left:0;z-index:20;transform:translateX(-100%);transition:transform .18s;padding-top:env(safe-area-inset-top)}#side.open{transform:none}#proj{display:none}}
@media(prefers-reduced-motion:reduce){#side{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <button id="burger" aria-label="Files">&#9776;</button>
    <span class="logo">A</span>
    <label class="pick">Language
      <select id="lang"></select></label>
    <label class="pick">Style
      <select id="ide"></select></label>
    <span id="proj"></span>
  </div>
  <div id="body">
    <aside id="side">
      <div class="sh"><span id="projname">PROJECT</span><button id="new">+ New</button></div>
      <div id="files"></div>
      <div id="userline"><span id="who">signed in</span><button id="out">Sign out</button></div>
    </aside>
    <main id="main">
      <div id="tabs"><div id="tab">Main.java</div></div>
      <div id="msgs">
        <div id="empty"></div>
        <div id="list"></div>
      </div>
      <form id="composer">
        <span class="pr">&gt;</span>
        <textarea id="in" rows="1" placeholder="Ask your tutor..."></textarea>
        <button id="send" type="submit" disabled>Run</button>
      </form>
    </main>
  </div>
  <div id="status"><span id="sl"></span><span id="si"></span><span class="r" id="sc">UTF-8</span></div>
</div>

<script>
const API="https://frosty-moon-2b57.oakambe24fi.workers.dev",TK="asaplimo_session_token",PK="asaplimo_ide_prefs";
const LANGS={
  java:{name:"Java",file:"Main.java",ides:{intellij:"IntelliJ IDEA",eclipse:"Eclipse",vscode:"VS Code",netbeans:"NetBeans"},
    hint:"public class Main {\n    public static void main(String[] args) {\n        // ask me anything about Java\n    }\n}"},
  python:{name:"Python",file:"main.py",ides:{pycharm:"PyCharm",vscode:"VS Code",idle:"IDLE",jupyter:"Jupyter"},
    hint:"def main():\n    # ask me anything about Python\n    pass"},
  js:{name:"JavaScript",file:"app.js",ides:{vscode:"VS Code",webstorm:"WebStorm",sublime:"Sublime Text"},
    hint:"// ask me anything about JavaScript\nconsole.log('hello');"},
  html:{name:"HTML/CSS",file:"index.html",ides:{vscode:"VS Code",webstorm:"WebStorm",sublime:"Sublime Text"},
    hint:"<!-- ask me anything about HTML and CSS -->\n<h1>Hello</h1>"}
};
// IntelliJ uses the default :root look, so map it to no attribute value
const $=id=>document.getElementById(id);
let prefs={lang:"java",ide:"intellij",ides:{}};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(PK)||"{}"))}catch(e){}
if(!LANGS[prefs.lang])prefs.lang="java";
let convId=null,convs=[],busy=false;
const tok=()=>{try{return localStorage.getItem(TK)}catch(e){return null}};
const hd=x=>{const h=Object.assign({},x||{}),t=tok();if(t)h.Authorization="Bearer "+t;return h};
function save(){try{localStorage.setItem(PK,JSON.stringify(prefs))}catch(e){}}

function applyStyle(){
  const L=LANGS[prefs.lang];
  $("lang").innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join("");
  $("lang").value=prefs.lang;
  let ide=prefs.ides[prefs.lang]||Object.keys(L.ides)[0];
  if(!L.ides[ide])ide=Object.keys(L.ides)[0];
  $("ide").innerHTML=Object.entries(L.ides).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  $("ide").value=ide;
  prefs.ides[prefs.lang]=ide;
  document.documentElement.setAttribute("data-ide",ide);
  $("tab").textContent=L.file;
  $("projname").textContent=L.ides[ide].toUpperCase()+" · PROJECT";
  $("proj").textContent="asaplimo ["+L.name+" tutor]";
  $("sl").textContent=L.name+" tutor";
  $("si").textContent=L.ides[ide];
  $("empty").textContent=L.hint;
  $("in").placeholder="Ask your "+L.name+" tutor...";
  save();renderFiles();
}
$("lang").onchange=e=>{prefs.lang=e.target.value;applyStyle()};
$("ide").onchange=e=>{prefs.ides[prefs.lang]=e.target.value;applyStyle()};

async function init(){
  if(!tok()){location.href="index.html";return}
  try{
    const r=await fetch(API+"/api/me",{headers:hd()}),d=await r.json();
    if(!d.authenticated){location.href="index.html";return}
    $("who").textContent=d.email||"signed in";
    $("app").classList.add("on");
    applyStyle();loadConvs();
  }catch(e){location.href="index.html"}
}
async function loadConvs(){
  try{const r=await fetch(API+"/api/conversations",{headers:hd()});convs=(await r.json()).conversations||[];renderFiles()}catch(e){}
}
function renderFiles(){
  const ext=LANGS[prefs.lang].file.split(".").pop();
  $("files").innerHTML="";
  convs.forEach(c=>{
    const b=document.createElement("button");
    b.className="file"+(c.id===convId?" on":"");
    const slug=(c.title||"chat").toLowerCase().replace(/[^a-z0-9]+/g,"_").slice(0,18).replace(/^_|_$/g,"")||"chat";
    b.innerHTML="<i></i><span></span>";
    b.lastChild.textContent=slug+"."+ext;
    b.title=c.title;
    b.onclick=()=>{$("side").classList.remove("open");openConv(c.id)};
    $("files").appendChild(b);
  });
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function render(t){
  const p=t.split(/```(\w*)\n?([\s\S]*?)```/g);let h="";
  for(let i=0;i<p.length;i+=3){
    h+=esc(p[i]||"").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>");
    if(p[i+2]!==undefined)h+="<pre>"+esc(p[i+2].replace(/\n$/,""))+"</pre>";
  }
  return h;
}
let ln=0;
function add(role,text){
  $("empty").style.display="none";$("list").style.display="flex";
  const m=document.createElement("div");m.className="m "+(role==="user"?"u":"a");
  ln++;
  m.innerHTML='<div class="gut">'+(role==="user"?"&gt;":ln)+'</div><div class="txt"></div>';
  const t=m.lastChild;
  if(role==="user")t.textContent=text;else t.innerHTML=render(text||"");
  $("list").appendChild(m);$("msgs").scrollTop=$("msgs").scrollHeight;
  return m;
}
function reset(){convId=null;ln=0;$("list").innerHTML="";$("list").style.display="none";$("empty").style.display="block";renderFiles()}
async function openConv(id){
  try{
    const r=await fetch(API+"/api/conversations/"+id,{headers:hd()});if(!r.ok)return;
    const c=await r.json();convId=c.id;ln=0;$("list").innerHTML="";
    if(c.messages&&c.messages.length)c.messages.forEach(m=>add(m.role,m.text));else reset();
    renderFiles();
  }catch(e){}
}
async function ensure(){
  if(convId)return convId;
  try{
    const r=await fetch(API+"/api/conversations",{method:"POST",headers:hd({"Content-Type":"application/json"}),body:JSON.stringify({mode:"chat"})});
    convId=(await r.json()).id;await loadConvs();
  }catch(e){}
  return convId;
}
$("new").onclick=()=>{reset();$("side").classList.remove("open")};
$("burger").onclick=()=>$("side").classList.toggle("open");
$("out").onclick=async()=>{try{await fetch(API+"/api/logout",{method:"POST",headers:hd()})}catch(e){}try{localStorage.removeItem(TK)}catch(e){}location.href="index.html"};

const inp=$("in");
function upd(){$("send").disabled=busy||!inp.value.trim()}
inp.oninput=()=>{inp.style.height="auto";inp.style.height=inp.scrollHeight+"px";upd()};
inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
$("composer").onsubmit=e=>{e.preventDefault();send()};

async function send(){
  const text=inp.value.trim();if(!text||busy)return;
  busy=true;add("user",text);inp.value="";inp.style.height="auto";upd();
  const typing=add("assistant","");typing.querySelector(".txt").innerHTML='<span class="ty">running...</span>';
  const L=LANGS[prefs.lang];
  // tutor context is prepended so the bot teaches the picked language
  const msg="[Tutor mode: teach "+L.name+" to a beginner, one small step at a time, give hints before answers.]\n"+text;
  try{
    const id=await ensure();
    const r=await fetch(API+"/api/chat",{method:"POST",headers:hd({"Content-Type":"application/json"}),body:JSON.stringify({message:msg,conversationId:id,images:[],files:[]})});
    typing.remove();ln--;
    if(r.status===402){location.href="subscription.html";return}
    const d=await r.json();add("assistant",d.reply||"No response.");
    if(d.title){const c=convs.find(x=>x.id===id);if(c)c.title=d.title;renderFiles()}
  }catch(e){typing.remove();ln--;add("assistant","Could not reach the server.")}
  finally{busy=false;upd();inp.focus()}
}
init();
</script>
</body>
</html>
