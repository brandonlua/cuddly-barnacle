<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>asaplimo — log in</title>
<link rel="icon" type="image/png" href="icons/logo.png">
<style>
:root{
  --bg:#ffffff;--panel-bg:#ffffff;--border:#e5e5e2;
  --text:#1e1e1c;--text-dim:#6b6b66;--text-faint:#9c9c96;
  --accent:#3b5bfd;--accent-hover:#2d47d6;
  --danger:#e0483f;--sidebar-hover:#ececea;
  --shadow:0 1px 3px rgba(0,0,0,.04);--shadow-lg:0 20px 60px rgba(0,0,0,.12);
}
:root[data-theme="dark"]{
  --bg:#1b1b1a;--panel-bg:#212120;--border:#302f2d;
  --text:#ececea;--text-dim:#a7a7a1;--text-faint:#77766f;
  --accent:#5b7dff;--accent-hover:#7592ff;
  --danger:#ff6b61;--sidebar-hover:#262624;
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 20px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;-webkit-font-smoothing:antialiased;transition:background .15s ease,color .15s ease;}
button,input{font-family:inherit;}

#theme-btn{position:fixed;top:16px;right:16px;border:1px solid var(--border);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);background:var(--panel-bg);cursor:pointer;}
#theme-btn:hover{background:var(--sidebar-hover);}
#theme-btn svg{display:none;}
:root:not([data-theme="dark"]) #theme-btn .icon-moon{display:block;}
:root[data-theme="dark"] #theme-btn .icon-sun{display:block;}

.card{width:100%;max-width:380px;}
.mark{width:44px;height:44px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;margin:0 auto 18px;}
h1{font-size:20px;font-weight:600;text-align:center;margin-bottom:6px;letter-spacing:-.01em;}
.sub{color:var(--text-dim);font-size:13.5px;text-align:center;margin-bottom:26px;}

.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;font-weight:500;color:var(--text);background:var(--panel-bg);cursor:pointer;transition:background .1s ease;}
.btn:hover{background:var(--sidebar-hover);}
.btn.primary{background:#ffffff;border-color:var(--border);color:#000000;}
.btn.primary:hover{background:#f0f0f0;border-color:var(--border);}
.btn.secondary{background:transparent;}

.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--text-faint);font-size:12px;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}

form{display:flex;flex-direction:column;gap:10px;}
input[type="email"]{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 14px;outline:none;font-size:14px;color:var(--text);background:var(--panel-bg);}
input[type="email"]:focus{border-color:var(--accent);}
input::placeholder{color:var(--text-faint);}

.foot{color:var(--text-faint);font-size:12px;text-align:center;margin-top:22px;line-height:1.6;}
.foot a{color:var(--text-dim);}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
.overlay.active{display:flex;}
.modal{width:100%;max-width:380px;border-radius:16px;background:var(--panel-bg);padding:22px;box-shadow:var(--shadow-lg);}
.modal h3{margin-bottom:10px;font-size:17px;font-weight:600;}
.modal p{color:var(--text-dim);font-size:13.5px;margin-bottom:18px;line-height:1.55;}
.modal .btn{margin-bottom:8px;}
</style>
</head>
<body>

<button id="theme-btn" title="Toggle theme">
  <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
</button>

<div class="card">
  <div class="mark">A</div>
  <h1>Welcome to asaplimo</h1>
  <div class="sub">4 days free, then $5/month. Cancel anytime.</div>

  <button class="btn" id="google-btn">
    <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.48a5.54 5.54 0 01-2.4 3.64v3h3.88c2.27-2.09 3.56-5.17 3.56-8.83z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.96-2.9l-3.88-3c-1.08.72-2.46 1.15-4.08 1.15-3.13 0-5.78-2.11-6.73-4.96H1.26v3.11A12 12 0 0012 24z"/><path fill="#FBBC05" d="M5.27 14.29a7.2 7.2 0 010-4.58V6.6H1.26a12 12 0 000 10.8l4.01-3.11z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 001.26 6.6l4.01 3.11C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
    Continue with Google
  </button>

  <div class="divider">or</div>

  <form id="email-form">
    <input id="email-input" type="email" required placeholder="Enter your email">
    <button type="submit" class="btn primary">Continue with email</button>
  </form>

  <div class="foot">By continuing you agree to start a 4 day free trial, then $5/mo.<br>Made by gbubemi (aka Mitchell)</div>
</div>

<div class="overlay" id="trial-overlay">
  <div class="modal">
    <h3>Start your free trial</h3>
    <p>4 days free. Cancel anytime before it ends and you won't be charged. $5/mo after that.</p>
    <button class="btn primary" id="start-trial-btn">Start free trial</button>
    <button class="btn secondary" id="dismiss-trial-btn">Cancel</button>
  </div>
</div>

<script>
const API_BASE = "https://frosty-moon-2b57.oakambe24fi.workers.dev";
const TOKEN_KEY = "asaplimo_session_token";
const THEME_KEY = "asaplimo_theme";

function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
}
function initTheme(){
  let saved=null;
  try{ saved=localStorage.getItem(THEME_KEY); }catch(e){}
  if(!saved) saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(saved);
}
initTheme();
document.getElementById("theme-btn").addEventListener("click",()=>{
  const current=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  applyTheme(current);
});

function setToken(t){ try{ localStorage.setItem(TOKEN_KEY,t); }catch(e){} }
function getToken(){ try{ return localStorage.getItem(TOKEN_KEY); }catch(e){ return null; } }

function captureTokenFromUrl(){
  const p = new URLSearchParams(location.search);
  const t = p.get("token");
  if(t){ setToken(t); location.href = "chat.html"; }
}

async function checkSession(){
  const token = getToken();
  if(!token) return;
  try{
    const res = await fetch(API_BASE + "/api/me", { headers:{ Authorization:"Bearer "+token } });
    const data = await res.json();
    if(data.authenticated) location.href = "chat.html";
  }catch(e){}
}

document.getElementById("google-btn").addEventListener("click", () => {
  location.href = API_BASE + "/auth/google";
});

document.getElementById("email-form").addEventListener("submit", (e) => {
  e.preventDefault();
  document.getElementById("trial-overlay").classList.add("active");
});
document.getElementById("dismiss-trial-btn").addEventListener("click", () => {
  document.getElementById("trial-overlay").classList.remove("active");
});
document.getElementById("start-trial-btn").addEventListener("click", () => {
  location.href = API_BASE + "/auth/google";
});

captureTokenFromUrl();
checkSession();
</script>
</body>
</html>
