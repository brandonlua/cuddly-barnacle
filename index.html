<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>asaplimo — login</title>
<link rel="icon" type="image/png" href="icons/logo.png">
<style>
:root{--bg:#0c0c0c;--fg:#33ff33;--dim:#1c8c1c;--border:#1f4d1f;--panel:#0f150f;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--fg);font-family:"Courier New",monospace;height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.box{width:100%;max-width:420px;border:1px solid var(--border);background:var(--panel);padding:0;}
.bar{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);}
.dot{width:10px;height:10px;border-radius:50%;}
.dot.r{background:#ff5f56;}.dot.y{background:#ffbd2e;}.dot.g{background:#27c93f;}
.term{padding:20px;}
.line{margin-bottom:10px;}
.prompt{color:var(--fg);}
.prompt::before{content:"$ ";color:var(--dim);}
button,input{font-family:inherit;background:transparent;color:var(--fg);}
.btn{width:100%;text-align:left;border:1px solid var(--border);padding:10px 12px;margin-top:10px;cursor:pointer;}
.btn:hover{background:#122612;}
input{width:100%;border:1px solid var(--border);padding:10px 12px;outline:none;}
input::placeholder{color:var(--dim);}
.foot{color:var(--dim);font-size:12px;margin-top:16px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:16px;}
.overlay.active{display:flex;}
.modal{width:100%;max-width:380px;border:1px solid var(--border);background:var(--panel);padding:18px;}
.modal h3{margin-bottom:8px;}
.modal p{color:var(--dim);font-size:13px;margin-bottom:14px;line-height:1.5;}
</style>
</head>
<body>
<div class="box">
  <div class="bar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
  <div class="term">
    <div class="line">asaplimo login v1</div>
    <div class="line prompt">4 days free trial, then $5/month</div>
    <button class="btn" id="google-btn">sign-in --provider=google</button>
    <form id="email-form">
      <input id="email-input" type="email" required placeholder="enter email" style="margin-top:10px;">
      <button type="submit" class="btn">sign-in --provider=email</button>
    </form>
    <div class="foot">by continuing you start a 4 day free trial, then $5/mo.<br>made by gbubemi (aka Mitchell)</div>
  </div>
</div>

<div class="overlay" id="trial-overlay">
  <div class="modal">
    <h3>start free trial</h3>
    <p>4 days free. cancel anytime before it ends and you won't be charged. $5/mo after.</p>
    <button class="btn" id="start-trial-btn">confirm --start-trial</button>
    <button class="btn" id="dismiss-trial-btn">cancel</button>
  </div>
</div>

<script>
const API_BASE = "https://frosty-moon-2b57.oakambe24fi.workers.dev";
const TOKEN_KEY = "asaplimo_session_token";

function setToken(t){ try{ localStorage.setItem(TOKEN_KEY,t); }catch(e){} }
function getToken(){ try{ return localStorage.getItem(TOKEN_KEY); }catch(e){ return null; } }

function captureTokenFromUrl(){
  const p = new URLSearchParams(location.search);
  const t = p.get("token");
  if(t){ setToken(t); location.href = "chat.html"; }
}

async function checkSession(){
  const token = getToken();
  if(!token) return;
  try{
    const res = await fetch(API_BASE + "/api/me", { headers:{ Authorization:"Bearer "+token } });
    const data = await res.json();
    if(data.authenticated) location.href = "chat";
  }catch(e){}
}

document.getElementById("google-btn").addEventListener("click", () => {
  location.href = API_BASE + "/auth/google";
});

document.getElementById("email-form").addEventListener("submit", (e) => {
  e.preventDefault();
  document.getElementById("trial-overlay").classList.add("active");
});
document.getElementById("dismiss-trial-btn").addEventListener("click", () => {
  document.getElementById("trial-overlay").classList.remove("active");
});
document.getElementById("start-trial-btn").addEventListener("click", () => {
  location.href = API_BASE + "/auth/google";
});

captureTokenFromUrl();
checkSession();
</script>
</body>
</html>
