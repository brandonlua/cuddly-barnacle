<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>asaplimo — log in</title>
<link rel="icon" type="image/png" href="icons/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<script>try{var t=localStorage.getItem("asaplimo_theme");document.documentElement.setAttribute("data-theme",t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))}catch(e){}</script>
<style>
:root{--bg:#faf9f5;--panel:#fff;--hover:#ebe8df;--line:#e2dfd6;--text:#1f1e1d;--dim:#66645d;--faint:#99968d;--accent:#c4623f}
:root[data-theme="dark"]{--bg:#262624;--panel:#30302e;--hover:#3a3937;--line:#3e3d3a;--text:#f3f1ea;--dim:#b3b0a7;--faint:#7e7b73;--accent:#d9805f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 Inter,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.box{width:100%;max-width:360px}
.word{font:500 26px "Source Serif 4",Georgia,serif;margin-bottom:36px;text-align:center}
h1{font:400 30px/1.2 "Source Serif 4",Georgia,serif;text-align:center;letter-spacing:-.01em;margin-bottom:10px}
.sub{color:var(--dim);text-align:center;margin-bottom:30px}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:500;background:var(--panel);cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn.primary:hover{opacity:.88}
.btn.secondary{background:transparent;border-color:transparent;color:var(--dim)}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--faint);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
form{display:flex;flex-direction:column;gap:10px}
input[type="email"]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);outline:none}
input[type="email"]:focus{border-color:var(--faint)}
input::placeholder{color:var(--faint)}
.foot{color:var(--faint);font-size:13px;text-align:center;margin-top:28px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.active{display:flex}
.modal{width:100%;max-width:380px;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:24px}
.modal h3{font:500 22px "Source Serif 4",Georgia,serif;margin-bottom:8px}
.modal p{color:var(--dim);margin-bottom:20px}
.modal .btn{margin-bottom:8px}
</style>
</head>
<body>
<div class="box">
  <div class="word">asaplimo</div>
  <h1>Log in to continue</h1>
  <div class="sub">4 days free, then $5/month. Cancel anytime.</div>

  <button class="btn" id="google-btn">
    <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.48a5.54 5.54 0 01-2.4 3.64v3h3.88c2.27-2.09 3.56-5.17 3.56-8.83z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.96-2.9l-3.88-3c-1.08.72-2.46 1.15-4.08 1.15-3.13 0-5.78-2.11-6.73-4.96H1.26v3.11A12 12 0 0012 24z"/><path fill="#FBBC05" d="M5.27 14.29a7.2 7.2 0 010-4.58V6.6H1.26a12 12 0 000 10.8l4.01-3.11z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 001.26 6.6l4.01 3.11C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
    Continue with Google
  </button>

  <div class="divider">or</div>

  <form id="email-form">
    <input id="email-input" type="email" required placeholder="Email address">
    <button type="submit" class="btn primary">Continue with email</button>
  </form>

  <div class="foot">Made by gbubemi (aka Mitchell)</div>
</div>

<div class="overlay" id="trial-overlay">
  <div class="modal">
    <h3>Start your free trial</h3>
    <p>4 days free. Cancel before it ends and you won't be charged. $5/month after that.</p>
    <button class="btn primary" id="start-trial-btn">Start free trial</button>
    <button class="btn secondary" id="dismiss-trial-btn">Cancel</button>
  </div>
</div>

<script>
const API_BASE = "https://frosty-moon-2b57.oakambe24fi.workers.dev";
const TOKEN_KEY = "asaplimo_session_token";

function setToken(t){ try{ localStorage.setItem(TOKEN_KEY,t); }catch(e){} }
function getToken(){ try{ return localStorage.getItem(TOKEN_KEY); }catch(e){ return null; } }

function captureTokenFromUrl(){
  const t = new URLSearchParams(location.search).get("token");
  if(t){ setToken(t); location.href = "chat.html"; }
}

async function checkSession(){
  const token = getToken();
  if(!token) return;
  try{
    const res = await fetch(API_BASE + "/api/me", { headers:{ Authorization:"Bearer "+token } });
    const data = await res.json();
    if(data.authenticated) location.href = "chat.html";
  }catch(e){}
}

document.getElementById("google-btn").addEventListener("click", () => { location.href = API_BASE + "/auth/google"; });
document.getElementById("email-form").addEventListener("submit", (e) => {
  e.preventDefault();
  document.getElementById("trial-overlay").classList.add("active");
});
document.getElementById("dismiss-trial-btn").addEventListener("click", () => {
  document.getElementById("trial-overlay").classList.remove("active");
});
document.getElementById("start-trial-btn").addEventListener("click", () => { location.href = API_BASE + "/auth/google"; });

captureTokenFromUrl();
checkSession();
</script>
</body>
</html>
